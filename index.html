<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Habit Tracker</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-100 font-sans flex flex-col items-center p-3 sm:p-6 transition-colors duration-300">
  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/80 dark:border-slate-800 p-5 sm:p-6 space-y-5">
    
    <!-- Top Header Bar with Date & Controls -->
    <div class="flex items-center justify-between">
      <div>
        <span id="current-date-text" class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider block">Today</span>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">Habit Tracker</h1>
      </div>
      <div class="flex items-center gap-1.5">
        <button 
          type="button" 
          id="sound-toggle-btn" 
          class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
          title="Toggle Sound"
        >
          <span id="sound-icon">🔔</span>
        </button>
        <button 
          type="button" 
          id="dark-toggle-btn" 
          class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
          title="Toggle Dark Mode"
        >
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>

    <!-- 7-Day Calendar Strip -->
    <div class="bg-slate-50 dark:bg-slate-800/60 rounded-2xl p-3 border border-slate-100 dark:border-slate-800">
      <div id="calendar-strip" class="grid grid-cols-7 gap-1.5 text-center"></div>
    </div>

    <!-- Progress & Streak Card -->
    <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-4 text-white shadow-md shadow-emerald-500/20 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xs uppercase tracking-wider font-semibold opacity-90">Daily Goal</span>
          <span class="inline-flex items-center gap-1 text-xs font-bold px-2 py-0.5 rounded-full bg-white/20 backdrop-blur-sm border border-white/20">
            🔥 <span id="streak-count">1</span> day streak
          </span>
        </div>
        <span id="progress-percent" class="text-base font-extrabold">0%</span>
      </div>

      <div class="w-full bg-black/20 rounded-full h-2.5 overflow-hidden p-0.5">
        <div id="progress-bar" class="bg-white h-1.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
      </div>

      <div class="flex justify-between items-center text-xs opacity-90">
        <span id="sync-status">Ready to sync</span>
        <span id="progress-text" class="font-medium">0 of 0 completed</span>
      </div>
    </div>

    <!-- Analytics & Bar Chart Card (Daily / Weekly / Monthly) -->
    <div class="bg-slate-50 dark:bg-slate-800/40 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 space-y-3">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xs font-bold text-slate-800 dark:text-slate-200 uppercase tracking-wider">Analytics</h2>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">Completion history</p>
        </div>
        <div id="chart-time-filters" class="flex gap-1 bg-slate-200/70 dark:bg-slate-700/60 p-0.5 rounded-xl text-[11px] font-medium">
          <button type="button" data-time="daily" class="chart-btn px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm transition">Daily</button>
          <button type="button" data-time="weekly" class="chart-btn px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">Weekly</button>
          <button type="button" data-time="monthly" class="chart-btn px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">Monthly</button>
        </div>
      </div>

      <div class="relative h-40 w-full">
        <canvas id="analyticsChart"></canvas>
      </div>
    </div>

    <!-- Quick 1-Tap Habit Chips -->
    <div class="space-y-1.5">
      <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Quick Add Suggestions</span>
      <div id="quick-chips" class="flex flex-wrap gap-1.5">
        <button type="button" data-title="Drink 2L Water" data-category="Health" class="quick-chip px-2.5 py-1 bg-sky-50 dark:bg-sky-950/40 hover:bg-sky-100 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800 text-xs rounded-xl font-medium transition active:scale-95">
          💧 2L Water
        </button>
        <button type="button" data-title="20 min Walk" data-category="Fitness" class="quick-chip px-2.5 py-1 bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 text-xs rounded-xl font-medium transition active:scale-95">
          🏃 20m Walk
        </button>
        <button type="button" data-title="Read 15 Pages" data-category="Study" class="quick-chip px-2.5 py-1 bg-amber-50 dark:bg-amber-950/40 hover:bg-amber-100 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800 text-xs rounded-xl font-medium transition active:scale-95">
          📚 Read Book
        </button>
        <button type="button" data-title="10 min Meditation" data-category="Mind" class="quick-chip px-2.5 py-1 bg-purple-50 dark:bg-purple-950/40 hover:bg-purple-100 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800 text-xs rounded-xl font-medium transition active:scale-95">
          🧘 Meditate
        </button>
      </div>
    </div>

    <!-- Google Sheets Integration Banner -->
    <div class="bg-emerald-50/70 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800/60 rounded-2xl p-3 space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs font-semibold text-emerald-900 dark:text-emerald-200">Google Sheets Sync</span>
        </div>
        <button type="button" id="toggle-sheet-config" class="text-xs text-emerald-700 dark:text-emerald-400 hover:text-emerald-800 font-medium underline">
          Setup URL
        </button>
      </div>

      <div id="sheet-config-panel" class="hidden pt-2 border-t border-emerald-200/60 dark:border-emerald-800/40 space-y-2">
        <label for="sheet-url-input" class="text-xs text-emerald-800 dark:text-emerald-300 block">
          Paste your Google Apps Script Web App URL:
        </label>
        <div class="flex gap-2">
          <input 
            type="url" 
            id="sheet-url-input" 
            placeholder="https://script.google.com/macros/s/.../exec"
            class="flex-1 px-3 py-1.5 text-xs rounded-xl border border-emerald-300 dark:border-emerald-700 bg-white dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-emerald-500 text-slate-800 dark:text-slate-100"
          />
          <button type="button" id="save-url-btn" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-xl transition">
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- Add habit form -->
    <form id="habit-form" class="space-y-2">
      <div class="flex gap-2">
        <input 
          type="text" 
          id="habit-input" 
          placeholder="Add a custom habit..." 
          class="flex-1 px-4 py-2.5 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-800 dark:text-slate-100 transition"
          autocomplete="off"
          required
        />
        <select 
          id="habit-category-select" 
          class="px-2.5 py-2.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500"
        >
          <option value="Health">💧 Health</option>
          <option value="Fitness">🏃 Fitness</option>
          <option value="Study">📚 Study</option>
          <option value="Work">💼 Work</option>
          <option value="Mind">🧘 Mind</option>
        </select>
        <button 
          type="submit" 
          id="add-btn" 
          class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl transition shadow-md shadow-emerald-600/20 active:scale-95"
        >
          Add
        </button>
      </div>
    </form>

    <!-- Filter Tabs -->
    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-2">
      <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Your Habits</span>
      <div id="filter-container" class="flex gap-1 bg-slate-100 dark:bg-slate-800 p-0.5 rounded-xl text-xs font-medium">
        <button type="button" data-filter="all" class="filter-btn px-2.5 py-1 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition">All</button>
        <button type="button" data-filter="active" class="filter-btn px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 transition">Active</button>
        <button type="button" data-filter="completed" class="filter-btn px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 transition">Completed</button>
      </div>
    </div>

    <!-- Habit list -->
    <ul id="habit-list" class="space-y-2.5"></ul>

    <!-- Footer Controls -->
    <div class="pt-2 flex justify-between items-center text-xs text-slate-400 dark:text-slate-500 border-t border-slate-100 dark:border-slate-800">
      <button type="button" id="export-btn" class="inline-flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 hover:text-emerald-700 font-semibold transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Export to Excel (CSV)
      </button>
      <button type="button" id="reset-btn" class="hover:text-rose-500 transition underline underline-offset-2">
        Reset
      </button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'daily_habits_v6';
    const SHEET_URL_KEY = 'google_sheet_webhook_url';
    const STREAK_KEY = 'daily_habits_streak_count';
    const THEME_KEY = 'daily_habits_theme';
    const SOUND_KEY = 'daily_habits_sound_enabled';

    const CATEGORY_COLORS = {
      Health: { bg: 'bg-sky-50 dark:bg-sky-950/40', text: 'text-sky-700 dark:text-sky-300', border: 'border-sky-200 dark:border-sky-800', icon: '💧' },
      Fitness: { bg: 'bg-emerald-50 dark:bg-emerald-950/40', text: 'text-emerald-700 dark:text-emerald-300', border: 'border-emerald-200 dark:border-emerald-800', icon: '🏃' },
      Study: { bg: 'bg-amber-50 dark:bg-amber-950/40', text: 'text-amber-700 dark:text-amber-300', border: 'border-amber-200 dark:border-amber-800', icon: '📚' },
      Work: { bg: 'bg-indigo-50 dark:bg-indigo-950/40', text: 'text-indigo-700 dark:text-indigo-300', border: 'border-indigo-200 dark:border-indigo-800', icon: '💼' },
      Mind: { bg: 'bg-purple-50 dark:bg-purple-950/40', text: 'text-purple-700 dark:text-purple-300', border: 'border-purple-200 dark:border-purple-800', icon: '🧘' }
    };

    const DEFAULT_HABITS = [
      { id: 1, title: 'Drink 2 liters of water', category: 'Health', completed: false },
      { id: 2, title: 'Read for 15 minutes', category: 'Study', completed: true },
      { id: 3, title: 'Take a morning walk', category: 'Fitness', completed: false }
    ];

    function loadHabits() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (e) {
        console.warn('Storage not accessible:', e);
      }
      return DEFAULT_HABITS;
    }

    function saveHabits() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
      } catch (e) {
        console.warn('Failed to save to storage:', e);
      }
    }

    let habits = loadHabits();
    let sheetWebhookUrl = '';
    let streak = 1;
    let currentFilter = 'all';
    let currentChartTime = 'daily';
    let isDarkMode = false;
    let isSoundEnabled = true;

    try {
      sheetWebhookUrl = localStorage.getItem(SHEET_URL_KEY) || '';
      const savedStreak = localStorage.getItem(STREAK_KEY);
      if (savedStreak) streak = parseInt(savedStreak, 10) || 1;
      isDarkMode = localStorage.getItem(THEME_KEY) === 'dark';
      isSoundEnabled = localStorage.getItem(SOUND_KEY) !== 'false';
    } catch (e) {
      console.warn('Could not read storage:', e);
    }

    if (isDarkMode) {
      document.documentElement.classList.add('dark');
    }

    let audioCtx = null;
    function playDing() {
      if (!isSoundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (err) {
        console.warn('Audio not available:', err);
      }
    }

    const habitForm = document.getElementById('habit-form');
    const habitInput = document.getElementById('habit-input');
    const habitCategorySelect = document.getElementById('habit-category-select');
    const habitList = document.getElementById('habit-list');
    const progressText = document.getElementById('progress-text');
    const progressPercent = document.getElementById('progress-percent');
    const progressBar = document.getElementById('progress-bar');
    const streakCount = document.getElementById('streak-count');
    const syncStatus = document.getElementById('sync-status');
    const toggleConfigBtn = document.getElementById('toggle-sheet-config');
    const configPanel = document.getElementById('sheet-config-panel');
    const sheetUrlInput = document.getElementById('sheet-url-input');
    const saveUrlBtn = document.getElementById('save-url-btn');
    const filterContainer = document.getElementById('filter-container');
    const chartTimeFilters = document.getElementById('chart-time-filters');
    const darkToggleBtn = document.getElementById('dark-toggle-btn');
    const themeIcon = document.getElementById('theme-icon');
    const soundToggleBtn = document.getElementById('sound-toggle-btn');
    const soundIcon = document.getElementById('sound-icon');
    const quickChipsContainer = document.getElementById('quick-chips');
    const currentDateText = document.getElementById('current-date-text');
    const calendarStrip = document.getElementById('calendar-strip');

    streakCount.textContent = streak;
    themeIcon.textContent = isDarkMode ? '☀️' : '🌙';
    soundIcon.textContent = isSoundEnabled ? '🔔' : '🔕';

    const today = new Date();
    currentDateText.textContent = today.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });

    function renderCalendarStrip() {
      calendarStrip.innerHTML = '';
      const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const currentDayIndex = today.getDay();

      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(today.getDate() - currentDayIndex + i);
        const isToday = i === currentDayIndex;
        const col = document.createElement('div');
        col.className = `flex flex-col items-center p-1.5 rounded-xl transition ${
          isToday 
            ? 'bg-emerald-600 text-white font-bold shadow-sm' 
            : 'text-slate-600 dark:text-slate-400'
        }`;
        col.innerHTML = `
          <span class="text-[10px] uppercase font-semibold opacity-80">${dayNames[i]}</span>
          <span class="text-xs mt-0.5">${d.getDate()}</span>
          <span class="w-1 h-1 rounded-full mt-1 ${isToday ? 'bg-white' : 'bg-emerald-500/70'}"></span>
        `;
        calendarStrip.appendChild(col);
      }
    }
    renderCalendarStrip();

    darkToggleBtn.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        document.documentElement.classList.add('dark');
        themeIcon.textContent = '☀️';
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.textContent = '🌙';
      }
      try {
        localStorage.setItem(THEME_KEY, isDarkMode ? 'dark' : 'light');
      } catch (e) {
        console.warn('Storage not saved:', e);
      }
      if (chartInstance) {
        chartInstance.destroy();
        initChart();
      }
    });

    soundToggleBtn.addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      soundIcon.textContent = isSoundEnabled ? '🔔' : '🔕';
      try {
        localStorage.setItem(SOUND_KEY, isSoundEnabled ? 'true' : 'false');
      } catch (e) {
        console.warn('Storage not saved:', e);
      }
      if (isSoundEnabled) playDing();
    });

    quickChipsContainer.addEventListener('click', (e) => {
      const chip = e.target.closest('.quick-chip');
      if (!chip) return;
      const title = chip.getAttribute('data-title');
      const cat = chip.getAttribute('data-category');
      
      const newHabit = {
        id: Date.now(),
        title: title,
        category: cat,
        completed: false
      };

      habits.push(newHabit);
      saveHabits();
      syncToGoogleSheet(newHabit, 'added');
      renderHabits();
    });

    if (sheetWebhookUrl) {
      sheetUrlInput.value = sheetWebhookUrl;
      syncStatus.textContent = 'Google Sheet connected';
    }

    toggleConfigBtn.addEventListener('click', () => {
      configPanel.classList.toggle('hidden');
    });

    saveUrlBtn.addEventListener('click', () => {
      const url = sheetUrlInput.value.trim();
      sheetWebhookUrl = url;
      try {
        localStorage.setItem(SHEET_URL_KEY, url);
      } catch (e) {
        console.warn('Could not save URL:', e);
      }
      configPanel.classList.add('hidden');
      if (url) {
        syncStatus.textContent = 'Google Sheet connected';
      } else {
        syncStatus.textContent = 'Ready to sync';
      }
    });

    filterContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      currentFilter = btn.getAttribute('data-filter');

      document.querySelectorAll('.filter-btn').forEach(b => {
        if (b === btn) {
          b.className = 'filter-btn px-2.5 py-1 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition';
        } else {
          b.className = 'filter-btn px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-800 transition';
        }
      });

      renderHabits();
    });

    const chartData = {
      daily: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Today'],
        data: [75, 100, 66, 80, 100, 50, 33]
      },
      weekly: {
        labels: ['3 Wks Ago', '2 Wks Ago', 'Last Wk', 'This Wk'],
        data: [70, 85, 90, 78]
      },
      monthly: {
        labels: ['Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
        data: [65, 80, 75, 88, 92, 78]
      }
    };

    let chartInstance = null;
    function initChart() {
      const ctx = document.getElementById('analyticsChart');
      if (!ctx) return;

      const isDark = document.documentElement.classList.contains('dark');
      const gridColor = isDark ? '#334155' : '#f1f5f9';
      const textColor = isDark ? '#94a3b8' : '#64748b';

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: chartData[currentChartTime].labels,
          datasets: [{
            label: 'Completion %',
            data: chartData[currentChartTime].data,
            backgroundColor: '#10b981',
            borderRadius: 6,
            hoverBackgroundColor: '#059669',
            maxBarThickness: 28
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return ` ${context.raw}% completed`;
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 100,
              ticks: {
                stepSize: 25,
                callback: function(v) { return v + '%'; },
                font: { size: 9 },
                color: textColor
              },
              grid: { color: gridColor }
            },
            x: {
              ticks: { font: { size: 9 }, color: textColor },
              grid: { display: false }
            }
          }
        }
      });
    }

    function updateChartTime(timeFrame) {
      currentChartTime = timeFrame;
      if (!chartInstance) return;

      const conf = chartData[timeFrame];
      chartInstance.data.labels = conf.labels;
      chartInstance.data.datasets[0].data = conf.data;
      chartInstance.update();
    }

    chartTimeFilters.addEventListener('click', (e) => {
      const btn = e.target.closest('.chart-btn');
      if (!btn) return;
      const timeFrame = btn.getAttribute('data-time');

      document.querySelectorAll('.chart-btn').forEach(b => {
        if (b === btn) {
          b.className = 'chart-btn px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm transition';
        } else {
          b.className = 'chart-btn px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition';
        }
      });

      updateChartTime(timeFrame);
    });

    function syncToGoogleSheet(habit, action) {
      if (!sheetWebhookUrl) return;

      syncStatus.textContent = 'Syncing to Drive...';

      const payload = {
        title: habit.title,
        category: habit.category || 'General',
        status: habit.completed ? 'Completed' : 'Pending',
        action: action,
        date: new Date().toLocaleString()
      };

      fetch(sheetWebhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        syncStatus.textContent = 'Synced to Google Sheet!';
        setTimeout(() => {
          if (sheetWebhookUrl) {
            syncStatus.textContent = 'Google Sheet connected';
          }
        }, 3000);
      })
      .catch((err) => {
        console.warn('Sync error:', err);
        syncStatus.textContent = 'Sync failed';
      });
    }

    let celebrationTriggered = false;

    function renderHabits() {
      habitList.innerHTML = '';

      let displayHabits = habits;
      if (currentFilter === 'active') {
        displayHabits = habits.filter(h => !h.completed);
      } else if (currentFilter === 'completed') {
        displayHabits = habits.filter(h => h.completed);
      }

      if (displayHabits.length === 0) {
        habitList.innerHTML = `
          <li class="text-center py-6 text-sm text-slate-400 dark:text-slate-500">
            ${currentFilter === 'all' ? 'No habits yet. Tap a quick chip above!' : 'No ' + currentFilter + ' habits found.'}
          </li>
        `;
      } else {
        displayHabits.forEach(habit => {
          const li = document.createElement('li');
          const cat = CATEGORY_COLORS[habit.category] || CATEGORY_COLORS.Health;

          li.className = `flex items-center justify-between p-3.5 rounded-2xl border transition ${
            habit.completed 
              ? 'bg-slate-50/70 dark:bg-slate-800/40 border-slate-200/50 dark:border-slate-800 text-slate-400 dark:text-slate-500' 
              : 'bg-white dark:bg-slate-850 border-slate-200/80 dark:border-slate-800 hover:border-emerald-300 dark:hover:border-emerald-700 shadow-sm'
          }`;

          li.innerHTML = `
            <div class="flex items-center gap-3 flex-1 cursor-pointer select-none" data-action="toggle" data-id="${habit.id}">
              <div class="w-5 h-5 rounded-lg border flex items-center justify-center transition ${
                habit.completed 
                  ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm shadow-emerald-600/30' 
                  : 'border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800'
              }">
                ${habit.completed ? '<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>' : ''}
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-semibold ${habit.completed ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}">
                  ${habit.title}
                </span>
                <span class="text-[10px] inline-flex items-center gap-1 font-semibold ${cat.text} w-fit mt-0.5">
                  <span>${cat.icon}</span> ${habit.category || 'General'}
                </span>
              </div>
            </div>
            <button 
              type="button" 
              data-action="delete" 
              data-id="${habit.id}" 
              class="text-slate-300 dark:text-slate-600 hover:text-rose-500 p-1.5 text-xs rounded-lg transition"
              title="Delete habit"
            >
              ✕
            </button>
          `;

          habitList.appendChild(li);
        });
      }

      const completedCount = habits.filter(h => h.completed).length;
      const totalCount = habits.length;
      const percent = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

      progressText.textContent = `${completedCount} of ${totalCount} completed`;
      progressPercent.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;

      chartData.daily.data[6] = percent;
      if (chartInstance && currentChartTime === 'daily') {
        chartInstance.data.datasets[0].data = chartData.daily.data;
        chartInstance.update();
      }

      if (percent === 100 && totalCount > 0 && !celebrationTriggered) {
        celebrationTriggered = true;
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 90,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      } else if (percent < 100) {
        celebrationTriggered = false;
      }
    }

    habitForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = habitInput.value.trim();
      if (!title) return;

      const newHabit = {
        id: Date.now(),
        title: title,
        category: habitCategorySelect.value,
        completed: false
      };

      habits.push(newHabit);
      saveHabits();
      syncToGoogleSheet(newHabit, 'added');
      habitInput.value = '';
      renderHabits();
    });

    habitList.addEventListener('click', (e) => {
      const toggleTarget = e.target.closest('[data-action="toggle"]');
      const deleteTarget = e.target.closest('[data-action="delete"]');

      if (toggleTarget) {
        const id = Number(toggleTarget.getAttribute('data-id'));
        const habit = habits.find(h => h.id === id);
        if (habit) {
          habit.completed = !habit.completed;
          if (habit.completed) {
            playDing();
          }
          saveHabits();
          syncToGoogleSheet(habit, 'toggled');
          renderHabits();
        }
      } else if (deleteTarget) {
        const id = Number(deleteTarget.getAttribute('data-id'));
        const habit = habits.find(h => h.id === id);
        habits = habits.filter(h => h.id !== id);
        saveHabits();
        if (habit) {
          syncToGoogleSheet(habit, 'deleted');
        }
        renderHabits();
      }
    });

    const resetBtn = document.getElementById('reset-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        habits = [...DEFAULT_HABITS];
        saveHabits();
        renderHabits();
      });
    }

    const exportBtn = document.getElementById('export-btn');
    if (exportBtn) {
      exportBtn.addEventListener('click', () => {
        if (!habits || habits.length === 0) return;
        const headers = ['ID', 'Habit', 'Category', 'Status', 'Date'];
        const rows = habits.map(h => [
          h.id,
          `"${h.title.replace(/"/g, '""')}"`,
          h.category || 'General',
          h.completed ? 'Completed' : 'Pending',
          new Date().toLocaleDateString()
        ]);
        const csvContent = 'data:text/csv;charset=utf-8,' 
          + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', 'habits_tracker.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    }

    initChart();
    renderHabits();
  </script>
</body>
</html>
